    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Sonko Sound - Usimamizi Salama wa Madeni na Wateja" />
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Sonko Sound" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sonko Sound" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="https://pics.sonkosound.store/file_0000000018a881f4bef28aaff0866bbd.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="https://pics.sonkosound.store/file_0000000018a881f4bef28aaff0866bbd.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="https://pics.sonkosound.store/file_0000000018a881f4bef28aaff0866bbd.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://pics.sonkosound.store/file_0000000018a881f4bef28aaff0866bbd.png" />
    <link rel="shortcut icon" href="https://pics.sonkosound.store/file_0000000018a881f4bef28aaff0866bbd.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>Sonko Sound - Debt Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('✅ Service Worker imesajiliwa:', registration.scope);
            })
            .catch(function(error) {
              console.log('❌ Service Worker haijasajiliwa:', error);
            });
        });
      }

      // PWA Install Prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
      });
    </script>
  </body>
</html>
